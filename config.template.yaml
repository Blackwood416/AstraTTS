# AstraTTS 配置文件模板
# ============================================================
# 请根据实际需要修改后保存为 config.yaml

# 资源根目录：存放核心模型(models_v1)、语种词典(dicts)等资源
ResourcesDir: "./resources"

# 默认使用的 Avatar ID
DefaultAvatarId: chenxing

# --- 角色列表定义 ---
Avatars:
- Id: chenxing                     # 角色唯一标识
  Name: 晨星                 # 在 WebUI 显示的名称
  Description: '尘白禁区中晨星的音色' # 角色简介
  DefaultReferenceId: default    # 默认使用的参考音频 ID
  References:                    # 参考音频配置（用于克隆音色或控制风格）
  - Id: default
    Name: 【正常】良宵方始，不必心急。
    AudioPath: "【正常】良宵方始，不必心急。.wav"
    Text: "良宵方始，不必心急。"
    Language: zh                 # 参考音频的语言 (zh/en/ja)

# 全局引擎设置：false 使用AstraTTS V1系列模型
UseEngineV2: false

# --- ONNX Runtime 性能与并行配置 ---
# IntraOpNumThreads: 算子内部并行线程数。建议设为物理核心数(如 4, 8, 16)，0 代表自动
# (macOS 自动模式会智能选择性能核数 P-Core，避免能效核拖累性能)
IntraOpNumThreads: 0
# InterOpNumThreads: 算子间并行线程数。TTS 链式结构建议设为 1，0 代表自动
InterOpNumThreads: 0
# GraphOptimizationLevel: 图优化级别 (0=禁用, 1=基础, 2=全部)。
GraphOptimizationLevel: 1

# --- 硬件加速（GPU 由 ggml 插件 EP 提供：Windows/Linux=Vulkan，macOS=Metal）---
# UseVocoderGgml: 混合模式，仅声码器 (vits) 使用 ggml GPU 插件，其余模型保持 CPU。
# 实测（AMD RX 5500 XT）vits 比 CPU 快约 5 倍，流式整链路约 2×、非流式约 25%（RTF 0.77 -> 0.52）。
# 需要支持 Vulkan 的显卡与驱动；库缺失或加载失败时自动回退 CPU，不影响可用性。推荐开启。
UseVocoderGgml: true
# UseBertCache: 启用 BERT 特征缓存。同一文本（含对齐）重复合成时直接复用结果，
# 省去一次约 280–390 ms 的 BERT 前向；缓存随引擎实例存活、容量 256（FIFO 淘汰）。默认 true。
UseBertCache: true
# UseBertNoLoopModel: 使用去 Loop 的 roberta 变体 (roberta_noloop.onnx)。
# 该变体把导致约 278 ms CPU 控制流的 Loop 节点替换为等价向量化算子（repeat_interleave 的
# CumSum+Gather 实现），CPU 与 GPU 后端均受益。文件不存在时自动回退原模型。
# 默认 false：请先确认已用对比工具验证两者输出逐位一致后再开启。
UseBertNoLoopModel: false
# UseCoreML: 仅 macOS 有效。默认 false：实测对 GPT-SoVITS 模型 CoreML 反而比纯 CPU 慢
# (因子图切分 + ANE/CPU 数据搬运开销)。仅在你的模型确实受益时再尝试开启。
UseCoreML: false
# CoreMLFlags: CoreML 标志位 (按位或)，2=子图回退；4=优先 ANE；16=MLProgram 格式
CoreMLFlags: 2

# --- 情感控制（无参考音频的情感引导）---
# UseEmotionControl: 启用情感控制。按请求的 EmotionId 向说话人嵌入 (sv_emb, 20480 维) 注入
# 情感方向向量 τ（x_new = x_base + α·||x_base||·τ̂），再经 prompt_encoder 重算 ge/ge_advanced，
# 从而在不提供情感参考音频的情况下引导情感表达。τ 文件缺失时静默禁用。默认 false。
UseEmotionControl: false
# EmotionVectorPath: τ 目录（相对 ResourcesDir）。需包含 manifest.json 与 tau_<emotion>.f32，
# 用 tools/emotion/extract_tau.py 从 CSEMOTIONS 数据集生成。
EmotionVectorPath: emotion_vectors
# EmotionAlpha: 默认情感强度 α。经验区间 0.1~0.5：过小无明显效果，过大损伤音色相似度。
EmotionAlpha: 0.3

# 推理会话池容量：支持的最大并发合成请求数
PoolCapacity: 1
# 是否复用内存：开启后不同会话将共享模型实例以节省内存
ReuseMemory: true

# --- 合成参数默认值 ---
Speed: 1.0                       # 语速控制 (0.5 - 2.0)
StreamingMode: true              # CLI是否默认开启流式播放反馈
StreamingChunkSize: 22           # 流式合成的 Token 分块大小（越小延迟越低，但 CPU 压力越大）
StreamingPreBufferChunks: 2      # 音频预缓冲块数（减少生成卡顿）
# VocoderRetriggerFactor: 流式声码器重触发阈值的增长因子 (1.2 - 4.0)。
# 声码器每次调用都对"累计全部 token"重算，单句总计算量约为最终 token 数的 2~3 倍。
# 提高该因子（如 2.0）可显著减少重算、降低长文本压力，代价是音频分块间隔变大、首包后延迟略增。
VocoderRetriggerFactor: 1.5

# WASAPI 独占模式（仅影响本地 CLI/Windows 服务直接输出，不影响 Web 流传输）
WasapiExclusiveMode: false
# 播放音频环形缓冲区大小 (字节)
LockFreeBufferSize: 2097152

# 调试模式：开启后控制台会详细输出引擎日志
DebugMode: false

# --- 推理质量控制 (幻听过滤与自动重试机制) ---
Inference:
  MaxRetries: 3                  # 单句推理失败（检测到幻听/截断）后的最大自动重试次数
  # 各语言的推理长度系数（阈值），越高越容易触发重试
  MinTokenMultiplierChinese: 2.0
  MinTokenMultiplierJapanese: 1.7
  MinTokenMultiplierEnglish: 1.3
  MinTokenMultiplierOther: 0.5   # 标点和其他符号的重试系数

# --- 语种与 G2P (文本转音素) 配置 ---
G2P:
  # 自定义词典：位于 ResourcesDir/dicts 下的文件名
  CustomDictPath: custom_dict.txt
  # 英文G2P优先级：0-词典优先，1-仅词典，2-模型优先
  PriorityMode: 0
  # 允许检测和放行的语言列表（三选二）：["zh", "en", "ja"]
  Languages: ["zh", "ja"]